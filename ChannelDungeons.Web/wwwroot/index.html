<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Channel Dungeons - An MMORPG played entirely in Discord" />
    <title>Channel Dungeons - MMORPG in Discord</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="dungeon-gate.svg" type="image/svg+xml" />
    <style>
        .loading-progress-text {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            color: #dcddde;
        }

        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.6rem 1.25rem;
            background: #b32121;
            color: #ffffff;
            z-index: 1000;
        }

        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }
    </style>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-progress-text">Loading Channel Dungeons&hellip;</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss error">🗙</button>
    </div>
    <script src="app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
